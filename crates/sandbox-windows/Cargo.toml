[package]
name = "sandbox-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Coloride: the only crate with `unsafe` code. Launches a process inside a Windows AppContainer, in a Job Object, behind a safe API."

# Deliberately NOT `[lints] workspace = true`: the workspace forbids `unsafe_code` and a `forbid`
# cannot be lowered from inside a crate. Every other crate keeps the workspace table. Here the
# `unsafe` is allowed but must be justified: every block needs a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "warn"

[target.'cfg(windows)'.dependencies]
# Microsoft's raw bindings, nothing else. Reviewed in DEPENDENCIES.md.
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
