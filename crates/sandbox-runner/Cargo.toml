[package]
name = "sandbox-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hilo Isolated Sandbox Runner: Native OS Sandbox (Seatbelt/Landlock/AppContainer <5ms), Warm OCI Pool, Fargate & Firecracker (Fail-Closed)"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe process-group signalling, as in host-core (no `unsafe` in this crate).
rustix = { version = "=1.1.6", features = ["process"] }
# Same reviewed version as host-core; used only to attach the OS sandbox wrapper to a PTY.
portable-pty = "=0.9.0"

[target.'cfg(windows)'.dependencies]
# The only `unsafe` of the workspace, behind a safe API.
sandbox-windows.workspace = true

[dev-dependencies]
tempfile.workspace = true
