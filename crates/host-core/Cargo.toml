[package]
name = "host-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Coloride Native Rust Host Core: ropey buffers, WAL journal, Git checkpoints, LSP/Biome/DAP, 1-click migration & VS Code Extension Host supervisor"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
ts-rs.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
ropey.workspace = true
tokio.workspace = true

# Terminal service (LOT-010). Reviewed: see DEPENDENCIES.md.
portable-pty = "=0.9.0"

# Git checkpoints (LOT-011). No network features; libgit2 built from source. See DEPENDENCIES.md.
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
# Copy-on-Write task worktrees (LOT-011). See DEPENDENCIES.md.
reflink-copy = { version = "=0.1.30", default-features = false }

[target.'cfg(unix)'.dependencies]
# Safe process-group signalling (no `unsafe` in this crate). Already in the dependency tree.
rustix = { version = "=1.1.6", features = ["process"] }

[target.'cfg(windows)'.dependencies]
# Safe Job Object process-tree supervision (no `unsafe` in this crate).
sandbox-windows.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
