[package]
name = "agent-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Host-owned, per-session provider egress and credential injection for ACP agents"

[lints]
workspace = true

[dependencies]
agent-registry.workspace = true
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
url = "=2.5.8"
base64 = "=0.22.1"
getrandom = "=0.3.4"
constant_time_eq = "=0.4.2"
zeroize = "=1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
