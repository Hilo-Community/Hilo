[workspace]
resolver = "2"
members = [
    "crates/path-util",
    "crates/host-core",
    "crates/agent-registry",
    "crates/agent-gateway",
    "crates/model-gateway",
    "crates/context-engine",
    "crates/judge-orchestrator",
    "crates/sandbox-runner",
    "crates/sandbox-windows",
    "apps/desktop-tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Hilo-Community/hilo"
rust-version = "1.80"

[workspace.dependencies]
path-util = { path = "crates/path-util" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
ts-rs = "10.1"
thiserror = "2.0"
tracing = "0.1"
blake3 = "1.5"
# Line breaks are LF, CRLF and CR only, exactly as CodeMirror 6 and LSP count them. The default
# `unicode_lines` feature also breaks on U+2028, U+0085, ... and would shift every line number
# exchanged with the editor or a language server in a file containing one.
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
proptest = "1.5"
tempfile = "3.12"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
agent-registry = { path = "crates/agent-registry" }
agent-gateway = { path = "crates/agent-gateway" }
model-gateway = { path = "crates/model-gateway" }
host-core = { path = "crates/host-core" }
context-engine = { path = "crates/context-engine" }
judge-orchestrator = { path = "crates/judge-orchestrator" }
sandbox-runner = { path = "crates/sandbox-runner" }
sandbox-windows = { path = "crates/sandbox-windows" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Dependencies (Tauri, WebKit bindings, serde, SQLite, Tree-sitter, ropey, blake3...) are built
# optimized even in dev: unoptimized, they make `npm run dev` feel slow on every keystroke,
# search and IPC message. They are compiled once and cached; the workspace crates stay
# unoptimized, so incremental rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 2

